<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enriched Science Placement Mock Exam</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; padding: 20px; line-height: 1.6; }
        .container { max-width: 900px; margin: auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 4px solid #1a3a5a; margin-bottom: 30px; padding-bottom: 10px; }
        .q-card { background: #fafafa; border-left: 5px solid #1a3a5a; padding: 20px; margin-bottom: 25px; border-radius: 4px; }
        .q-text { font-weight: bold; font-size: 1.1em; margin-bottom: 15px; display: block; }
        .option { display: block; margin: 10px 0; cursor: pointer; padding: 8px; border-radius: 4px; border: 1px solid #ddd; }
        .option:hover { background: #eef4fb; }
        .btn { background: #1a3a5a; color: white; padding: 15px 30px; border: none; border-radius: 5px; cursor: pointer; font-size: 1.1em; width: 100%; }
        #result-box { display: none; margin-top: 30px; padding: 30px; border: 3px solid #28a745; text-align: center; background: #f8fff9; }
        .math { font-family: 'Courier New', monospace; font-weight: bold; color: #d35400; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Advanced Science placement Mock Exam</h1>
        <p><b>50 Question Comprehensive Test</b> | Level: 110% Difficulty</p>
    </div>

    <form id="scienceExam">
        <div id="questionsContainer"></div>
        <button type="button" class="btn" onclick="gradeExam()">Submit Final Answers</button>
    </form>

    <div id="result-box">
        <h2 id="scoreDisplay"></h2>
        <p id="feedback"></p>
        <button class="btn" style="background:#555; margin-top:10px;" onclick="window.location.reload()">Retry Test</button>
    </div>
</div>

<script>
const examData = [
    // PHYSICAL SCIENCE (Chemistry/Physics)
    { q: "An object with a mass of 4.0 kg is pushed with a force of 20 N. If friction provides a resisting force of 4 N, what is the net acceleration?", a: "4.0 m/s²", o: ["5.0 m/s²", "4.0 m/s²", "6.0 m/s²", "1.0 m/s²"] },
    { q: "A student mixes 25g of Reactant A with 75g of Reactant B in a sealed flask. After the reaction, 40g of Product C is formed along with Product D. What is the mass of Product D?", a: "60g", o: ["40g", "60g", "100g", "25g"] },
    { q: "Which of the following describes an isotope of Carbon-12 (6 protons, 6 neutrons)?", a: "An atom with 6 protons and 8 neutrons", o: ["An atom with 8 protons and 6 neutrons", "An atom with 6 protons and 8 neutrons", "An atom with 7 protons and 7 neutrons", "An ion with 6 protons and 5 electrons"] },
    { q: "If the temperature of a gas in a sealed, rigid container is tripled, what happens to the pressure?", a: "It triples", o: ["It stays the same", "It triples", "It is reduced by one-third", "It doubles"] },
    { q: "A sound wave travels through water at 1,500 m/s. If the frequency is 300 Hz, what is the wavelength?", a: "5.0 meters", o: ["0.2 meters", "5.0 meters", "450,000 meters", "1,200 meters"] },
    { q: "Which transition is an example of an exothermic physical change?", a: "Water vapor condensing into liquid water", o: ["Ice melting into liquid water", "Liquid water boiling into steam", "Dry ice sublimating into gas", "Water vapor condensing into liquid water"] },
    { q: "A 100g metal block at 100°C is placed in 100g of water at 20°C. The equilibrium temperature is 22°C. Which has the higher specific heat?", a: "Water", o: ["Metal", "Water", "They are equal", "Cannot be determined"] },
    { q: "A circuit has a 12V battery and two 4-ohm resistors in series. What is the total current?", a: "1.5 Amps", o: ["3 Amps", "1.5 Amps", "8 Amps", "48 Amps"] },
    { q: "Which color of light has the shortest wavelength and highest energy?", a: "Violet", o: ["Red", "Green", "Blue", "Violet"] },
    { q: "Newton's 2nd Law (F=ma) implies that if you double the force on an object and triple its mass, the acceleration will:", a: "Become 2/3 of the original", o: ["Double", "Triple", "Become 2/3 of the original", "Become 6x the original"] },
    { q: "What is the density of an object that has a mass of 50g and displaces water from 100mL to 125mL?", a: "2.0 g/mL", o: ["0.5 g/mL", "2.0 g/mL", "2.5 g/mL", "1.25 g/mL"] },
    { q: "Which of these is a pure substance?", a: "Distilled Water", o: ["Salt Water", "Air", "Distilled Water", "Brass"] },
    { q: "An electromagnet can be strengthened by which of the following?", a: "Increasing the number of coils", o: ["Increasing the number of coils", "Using a plastic core", "Shortening the wire", "Using a smaller battery"] },
    { q: "The kinetic energy of an object is 100J. If its velocity is doubled, what is its new kinetic energy?", a: "400J", o: ["200J", "400J", "800J", "100J"] },
    { q: "Which type of bond involves the sharing of electrons between two non-metals?", a: "Covalent", o: ["Ionic", "Covalent", "Metallic", "Hydrogen"] },
    
    // LIFE SCIENCE (Genetics/Biology)
    { q: "In a Punnett square, crossing RrYy x RrYy (dihybrid cross), what is the probability of a 'rryy' phenotype?", a: "1/16", o: ["1/4", "3/16", "9/16", "1/16"] },
    { q: "Which organelle is responsible for packaging and shipping proteins?", a: "Golgi Apparatus", o: ["Endoplasmic Reticulum", "Golgi Apparatus", "Lysosome", "Ribosome"] },
    { q: "What is the primary difference between eukaryotic and prokaryotic cells?", a: "Presence of a nucleus", o: ["Presence of DNA", "Presence of a cell membrane", "Presence of a nucleus", "Presence of cytoplasm"] },
    { q: "During Meiosis, 'Crossing Over' is significant because it:", a: "Increases genetic variation", o: ["Decreases mutation rates", "Increases genetic variation", "Produces identical clones", "Speeds up cell division"] },
    { q: "Which base pair is found in RNA but NOT in DNA?", a: "Uracil", o: ["Adenine", "Thymine", "Guanine", "Uracil"] },
    { q: "A food chain: Grass -> Grasshopper -> Frog -> Snake. Which level has the least available energy?", a: "Snake", o: ["Grass", "Grasshopper", "Frog", "Snake"] },
    { q: "If an organism has 40 chromosomes in its skin cells, how many are in its sperm cells?", a: "20", o: ["80", "40", "20", "10"] },
    { q: "Natural selection acts directly on an organism's:", a: "Phenotype", o: ["Genotype", "Phenotype", "Recessive alleles", "DNA sequence"] },
    { q: "Which process creates Glucose and Oxygen using sunlight?", a: "Photosynthesis", o: ["Cellular Respiration", "Photosynthesis", "Fermentation", "Transpiration"] },
    { q: "A symbiotic relationship where one organism benefits and the other is unharmed is:", a: "Commensalism", o: ["Mutualism", "Parasitism", "Commensalism", "Competition"] },
    { q: "The 'Central Dogma' of biology describes the flow of information as:", a: "DNA -> RNA -> Protein", o: ["Protein -> RNA -> DNA", "DNA -> RNA -> Protein", "RNA -> DNA -> Protein", "DNA -> Protein -> RNA"] },
    { q: "Which structure in a plant cell prevents it from bursting when full of water?", a: "Cell Wall", o: ["Cell Membrane", "Vacuole", "Cell Wall", "Cytoplasm"] },
    { q: "In a population of birds, beaks become longer over generations to reach deep nectar. This is:", a: "An adaptation", o: ["A mutation", "An adaptation", "Acquired trait", "Genetic drift"] },
    { q: "Which system is responsible for filtering waste from the blood?", a: "Excretory System", o: ["Circulatory System", "Digestive System", "Excretory System", "Endocrine System"] },
    { q: "Amino acids are the building blocks of which macromolecule?", a: "Proteins", o: ["Carbohydrates", "Lipids", "Proteins", "Nucleic Acids"] },

    // EARTH & SPACE SCIENCE
    { q: "Which evidence best supports the Big Bang Theory?", a: "Cosmic Microwave Background Radiation", o: ["Presence of Black Holes", "Cosmic Microwave Background Radiation", "Earth's magnetic field", "Solar eclipses"] },
    { q: "A rock sample has 25% of its original Carbon-14. If the half-life is 5,730 years, how old is it?", a: "11,460 years", o: ["5,730 years", "11,460 years", "17,190 years", "2,865 years"] },
    { q: "What causes the 'Redshift' observed in distant galaxies?", a: "The expansion of the universe", o: ["Galaxies moving toward us", "The expansion of the universe", "The death of stars", "Atmospheric interference"] },
    { q: "At a convergent boundary between an oceanic and continental plate, what usually occurs?", a: "Subduction of the oceanic plate", o: ["Creation of a rift valley", "Subduction of the oceanic plate", "Formation of a mid-ocean ridge", "Seafloor spreading"] },
    { q: "Which layer of the atmosphere contains the Ozone Layer?", a: "Stratosphere", o: ["Troposphere", "Stratosphere", "Mesosphere", "Exosphere"] },
    { q: "The primary driver of Earth's ocean currents and weather systems is:", a: "Uneven heating by the Sun", o: ["Earth's rotation", "The Moon's gravity", "Uneven heating by the Sun", "Volcanic activity"] },
    { q: "Which type of rock is formed by the cooling of magma underground?", a: "Intrusive Igneous", o: ["Extrusive Igneous", "Intrusive Igneous", "Sedimentary", "Metamorphic"] },
    { q: "If the Moon is in the 'Waxing Gibbous' phase, what phase comes next?", a: "Full Moon", o: ["First Quarter", "Full Moon", "New Moon", "Third Quarter"] },
    { q: "The San Andreas Fault in California is an example of which plate boundary?", a: "Transform", o: ["Divergent", "Convergent", "Transform", "Subduction"] },
    { q: "Which gas is the most significant contributor to the Greenhouse Effect?", a: "Water Vapor", o: ["Nitrogen", "Oxygen", "Water Vapor", "Argon"] },
    { q: "What is the primary reason Earth has magnetic poles?", a: "Liquid iron movement in the outer core", o: ["Magnetic rocks in the crust", "Liquid iron movement in the outer core", "The Moon's pull", "Solar wind"] },
    { q: "A 'Solar Eclipse' occurs during which moon phase?", a: "New Moon", o: ["Full Moon", "New Moon", "First Quarter", "Third Quarter"] },
    { q: "Which planet has the strongest gravitational pull?", a: "Jupiter", o: ["Earth", "Saturn", "Jupiter", "Neptune"] },
    { q: "The process of 'Desalination' removes what from water?", a: "Salt", o: ["Bacteria", "Salt", "Oxygen", "Sediment"] },
    { q: "What is the most abundant element in the Earth's crust?", a: "Oxygen", o: ["Silicon", "Iron", "Oxygen", "Aluminum"] },
    { q: "Which star type is the hottest?", a: "O-type (Blue)", o: ["M-type (Red)", "G-type (Yellow)", "O-type (Blue)", "K-type (Orange)"] },
    { q: "Tides are strongest (Spring Tides) during which moon phases?", a: "New and Full Moon", o: ["New and Full Moon", "First and Third Quarter", "Waning Gibbous", "Waxing Crescent"] },
    { q: "What forms when a massive star collapses at the end of its life cycle?", a: "Black Hole", o: ["White Dwarf", "Main Sequence Star", "Black Hole", "Red Giant"] },
    { q: "Which rock layer is oldest in an undisturbed sequence?", a: "The bottom layer", o: ["The top layer", "The bottom layer", "The middle layer", "The layer with fossils"] },
    { q: "Global convection currents in the atmosphere are called:", a: "Hadley Cells", o: ["Tectonic currents", "Hadley Cells", "Jet Streams", "Corridors"] }
];

function buildExam() {
    const container = document.getElementById('questionsContainer');
    examData.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'q-card';
        
        let optionsHtml = '';
        // Shuffle options for each question
        const shuffledOptions = [...item.o].sort(() => Math.random() - 0.5);
        
        shuffledOptions.forEach(opt => {
            optionsHtml += `
                <label class="option">
                    <input type="radio" name="q${index}" value="${opt}">
                    ${opt}
                </label>`;
        });

        div.innerHTML = `<span class="q-text">${index + 1}. ${item.q}</span>${optionsHtml}`;
        container.appendChild(div);
    });
}

function gradeExam() {
    let score = 0;
    examData.forEach((item, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        if (selected && selected.value === item.a) {
            score++;
        }
    });

    const percent = (score / examData.length) * 100;
    document.getElementById('scienceExam').style.display = 'none';
    const resultBox = document.getElementById('result-box');
    resultBox.style.display = 'block';
    document.getElementById('scoreDisplay').innerText = `Final Score: ${score} / 50 (${percent}%)`;
    
    let feedback = "";
    if (percent >= 90) feedback = "Distinguished! You are fully prepared for Enriched Science.";
    else if (percent >= 80) feedback = "Strong Performance. Review any missed Physical Science math.";
    else if (percent >= 70) feedback = "Proficient. Focus on more complex application questions.";
    else feedback = "Keep studying! Review the specific formulas and genetics logic.";
    
    document.getElementById('feedback').innerText = feedback;
    window.scrollTo(0, 0);
}

buildExam();
</script>
</body>
</html>
